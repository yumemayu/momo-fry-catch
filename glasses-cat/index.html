<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Glasses Cat by Momo.squirrels</title>
<link rel="stylesheet" href="../game.css">
<body data-game="cats">
<main>
<header class="game-heading"><img class="hello-rainbow" src="../assets/momo-squirrels.png" alt="Momo.squirrels" width="780" height="592"><h1>Find the Glasses Cat</h1></header>
<div class="cat-example" id="cat-example"><strong>Tap the cats wearing glasses!</strong></div>
<div class="stats"><span><img class="stat-icon" src="../assets/game-cat.png" alt=""> <output id="score">0</output> found</span><span><output id="time">30s left</output></span></div>
<div class="play-stack">
<div class="play-stage">
<div class="cat-grid game-field" id="cats" aria-label="Cats"></div>
<div class="game-card" id="ready-card">
<img src="../assets/game-cat.png" alt="" width="72" height="72">
<strong>Ready to play?</strong>
<div class="player-setup"><label for="nickname">Your nickname?</label><input id="nickname" maxlength="20" placeholder="e.g. Mochi" autocomplete="off" aria-describedby="player-hint"><small id="player-hint">A nickname is optional. Add one to save your score on this device.</small></div>
</div>
</div>
<div class="game-card" id="score-card" role="status" aria-atomic="true" hidden>
<span>Final score</span><strong id="final-score"></strong><p></p>
</div>
<button class="change-player" id="change-player" type="button" hidden>Change nickname</button>
<div class="play-row"><button class="play-primary" id="play" type="button">Play</button><button class="stop-button" id="stop" type="button" hidden>■ Stop</button></div>
<button id="practice" type="button">Practice</button>
</div>
<p id="result" role="status"></p>
<section class="score-board" aria-labelledby="board-title">
<div class="score-board-heading">
<h2 id="board-title"><img src="../assets/game-cat.png" alt="" width="38" height="38">Leaderboard</h2>
<div class="score-period" aria-label="Ranking period" role="group">
<button type="button" data-period="weekly" aria-pressed="true">This week</button>
<button type="button" data-period="all" aria-pressed="false">All time</button>
</div>
</div>
<p class="personal-best" id="personal-best"></p>
<ol id="score-list"></ol>
</section>
<nav aria-label="Choose a game">
<a href="../"><img class="game-art" src="../assets/game-fries.png" alt="" width="40" height="40"><span>Fry Catch</span></a>
<a href="../smiley-bun-catch/"><img class="game-art" src="../assets/game-bun.png" alt="" width="40" height="40"><span>Smiley Bun Catch</span></a>
<a aria-current="page" href="../glasses-cat/"><img class="game-art" src="../assets/game-cat.png" alt="" width="40" height="40"><span>Find the Glasses Cat</span></a>
<a href="../piano/"><span class="game-art piano-nav-icon" aria-hidden="true">♪</span><span>MOMO Piano</span></a>
<a href="../capybara-merge/"><img class="game-art" src="../capybara-merge/pieces/4.webp" alt="" width="40" height="40"><span>カピバラ温泉マージ</span></a>
</nav>
</main>
<footer class="feedback"><a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer">Send feedback</a>

</footer>

</html>
