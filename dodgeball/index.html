<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en-title="MOMO Dodgeball">MOMO ドッジボール</title>
<link rel="stylesheet" href="../language.css">
<link rel="stylesheet" href="dodgeball.css?v=hit-motion">
<script defer src="../language.js"></script>
<script defer src="dodgeball.js?v=hit-faces"></script>
</head>
<body>
<main>
  <header>
    <a href="../" data-ja="‹ ゲーム一覧">‹ Games</a>
    <h1 data-ja="MOMO ドッジボール">MOMO Dodgeball</h1>
  </header>
  <section class="court" aria-label="Dodgeball court" data-ja-label="ドッジボールコート">
    <div class="windows" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="score"><span data-ja="ヒット">Hits</span> <strong id="hits">0</strong> <span aria-hidden="true">·</span> <span data-ja="のこり">Left</span> <strong id="left">5</strong></div>
    <div class="opponent" aria-hidden="true">
      <img src="cat.webp" alt="" draggable="false">
      <img class="hit-face" data-face="squint" src="cat-squint.webp?v=avatar" alt="" draggable="false">
      <img class="hit-face" data-face="surprised" src="cat-surprised.webp?v=avatar" alt="" draggable="false">
      <img class="hit-face" data-face="dizzy" src="cat-dizzy.webp?v=avatar" alt="" draggable="false">
      <div class="impact"><i class="glasses"></i><i class="spark">✦</i><i class="spark">✧</i><i class="spark">✦</i></div>
      <span class="reaction" id="reaction" hidden></span>
    </div>
    <div class="aim" hidden aria-hidden="true"></div>
    <button id="ball" class="ball" type="button" aria-label="Throw the ball" data-ja-label="ボールを投げる" aria-describedby="guide"></button>
    <div id="finish" class="finish" hidden>
      <h2 id="result"></h2>
      <button type="button" id="retry" data-ja="もういちど">Play again</button>
    </div>
  </section>
  <p id="guide" data-ja="ボールを上にスワイプ。キーボードでは ← → で狙って Enter。">Swipe the ball up. With a keyboard, aim with ← → and press Enter.</p>
  <p id="status" class="sr-only" role="status"></p>
</main>
</body>
</html>
