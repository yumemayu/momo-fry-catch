<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en-title="Capybara Onsen Merge – Free Merge Puzzle | Momo.squirrels">カピバラ温泉マージ｜無料の合体パズル | Momo.squirrels</title>

<link rel="canonical" href="https://yumemayu.github.io/momo-fry-catch/capybara-merge/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Momo.squirrels">
<meta property="og:title" content="Capybara Onsen Merge">
<meta property="og:description" content="同じカピバラをくっつけて、大きく育てよう。">
<meta property="og:url" content="https://yumemayu.github.io/momo-fry-catch/capybara-merge/">
<meta property="og:image" content="https://yumemayu.github.io/momo-fry-catch/assets/ogp/capybara-merge.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Two capybaras meeting in a stone hot spring.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../game.css">
<link rel="stylesheet" href="../language.css">
<link rel="stylesheet" href="merge.css">
<link rel="stylesheet" href="../game-title-banner.css">
<script defer src="../language.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script defer src="../scores.js"></script>
<script defer src="merge.js"></script>
</head>
<body data-game="capybara">
<main class="capy-main">
  <header class="game-heading game-title-banner">
    <span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="game-title-art" aria-hidden="true"></span>
    <h1><span data-en="Capybara">カピバラ</span><br><span data-en="Onsen Merge">温泉マージ</span></h1>
  </header>
  <div class="capy-modes" role="group" aria-label="あそびかた" data-en-label="Game mode">
    <button type="button" data-level="quick" aria-pressed="true"><span data-en="1-Minute Merge">1分マージ</span></button>
    <button type="button" data-level="standard" aria-pressed="false"><span data-en="Relaxed Merge">ゆったりマージ</span></button>
  </div>
  <div class="stats capy-stats">
    <span id="quick-clock"><span class="capy-stat-label" data-en="Time">のこり</span> <output id="quick-time" aria-live="off">60</output><span data-en="sec">秒</span></span>
    <span><span class="capy-stat-label" data-en="Score">スコア</span> <output id="score">0</output></span>
    <span><span class="capy-stat-label" data-en="Next">つぎ</span> <img id="next-piece" src="pieces/1.webp" alt="ゆず" width="44" height="44"></span>
  </div>
  <section class="capy-guide" aria-labelledby="guide-title">
    <h2 id="guide-title" data-en="Growth Guide">成長ずかん</h2>
    <ol id="growth"></ol>
    <p id="growth-best">いちばん育った姿 —</p>
  </section>
  <div class="play-stack">
    <div class="play-stage">
      <canvas class="game-field" id="field" width="360" height="420" tabindex="0"
        aria-label="温泉の盤面" data-en-label="Onsen play area" aria-describedby="instructions">カピバラ温泉の盤面</canvas>
      <div class="game-card" id="ready-card">
        <img src="pieces/4.webp" alt="" width="58" height="58">
        <strong data-en="Ready to play?">はじめよう！</strong>
        <div class="player-setup">
          <label for="nickname" data-en="Nickname">ニックネーム</label>
          <input id="nickname" maxlength="20" placeholder="例：もち" data-en-placeholder="e.g. Mochi" autocomplete="off" aria-describedby="player-hint">
          <small id="player-hint" data-en="Enter a nickname to save your score on this device.">なまえを入れると、この端末にスコアが残るよ。</small>
        </div>
      </div>
    </div>
    <div class="game-card" id="score-card" role="status" aria-atomic="true" hidden>
      <span data-en="Score">スコア</span><strong id="final-score"></strong>
      <p></p><span id="final-growth"></span>
    </div>
    <button type="button" id="change-player" class="change-player" data-en="Change nickname" hidden>ニックネームをかえる</button>
    <div class="play-row">
      <button class="play-primary" id="start" type="button">Play</button>
      <button class="stop-button" id="stop" type="button" hidden>■ Stop</button>
    </div>
    <div class="controls move-pad" role="group" aria-label="アイテムのそうさ" data-en-label="Piece controls">
      <button id="left" type="button" aria-label="左へ" data-en-label="Move left" disabled>←</button>
      <button id="drop" type="button" data-en="Drop" disabled>おとす</button>
      <button id="right" type="button" aria-label="右へ" data-en-label="Move right" disabled>→</button>
    </div>
  </div>
  <p id="instructions" data-en="Move a piece left or right, then drop it. Matching pieces merge!">左右にうごかして、同じアイテムをくっつけよう。</p>
  <p id="notice" class="capy-notice" role="status" aria-live="polite"></p>
  <div class="music"><button id="sound" type="button" aria-pressed="true">おと ON</button></div>
  <section class="score-board" aria-labelledby="board-title">
    <div class="score-board-heading">
      <h2 id="board-title"><img src="pieces/4.webp" alt="" width="24" height="24"><span data-en="Leaderboard">ランキング</span></h2>
      <span id="score-level"></span>
      <div class="score-period" aria-label="Ranking period" role="group">
        <button type="button" data-period="weekly" aria-pressed="true" data-en="This week">今週</button>
        <button type="button" data-period="all" aria-pressed="false" data-en="All time">すべて</button>
      </div>
    </div>
    <p class="personal-best" id="personal-best"></p>
    <ol id="score-list"></ol>
  </section>
  <nav aria-label="Choose a game">
    <a href="../"><img class="game-art" src="../assets/game-fries.png" alt="" width="40" height="40"><span data-en="Fry Catch">フライキャッチ</span></a>
    <a href="../smiley-bun-catch/"><img class="game-art" src="../assets/game-bun.png" alt="" width="40" height="40"><span data-en="Smiley Bun Catch">にこにこ肉まんキャッチ</span></a>
    <a href="../glasses-cat/"><img class="game-art" src="../assets/game-cat.png" alt="" width="40" height="40"><span data-en="Find the Glasses Cat">メガネ猫さがし</span></a>
    <a href="../piano/"><span class="game-art piano-nav-icon" aria-hidden="true">♪</span><span data-en="MOMO Piano">MOMOピアノ</span></a>
    <a aria-current="page" href="./"><img class="game-art" src="pieces/4.webp" alt="" width="40" height="40"><span data-en="Capybara Onsen Merge">カピバラ温泉マージ</span></a>
    <a href="../capybara-memory/"><img class="game-art" src="../capybara-merge/pieces/10.webp" alt="" width="40" height="40"><span data-en="Capybara Memory">カピバラ神経衰弱</span></a>
    <a href="../capybara-tap/"><img class="game-art" src="../capybara-merge/pieces/7.webp" alt="" width="40" height="40"><span data-en="Capybara Bath Tap">カピバラおふろタップ</span></a>
    <a href="../cat-trap/"><svg class="game-art" viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="7" width="50" height="50" rx="11" fill="#cdeeb2"/><rect x="43" y="1" width="17" height="14" rx="2.5" fill="#d9a066" stroke="#b57e42" stroke-width="1.6"/><g transform="translate(9.6 7) scale(0.7)"><path d="M9 30 11 11 26 19 Q32 17 38 19 L53 11 55 30 C65 65 -1 65 9 30Z" fill="#fdf3e3" stroke="#57344a" stroke-width="3"/><path d="M15 17 21 23 14 26Z M49 17 50 26 43 23Z" fill="#f987aa"/><circle cx="23" cy="35" r="2.4" fill="#57344a"/><circle cx="41" cy="35" r="2.4" fill="#57344a"/><path d="M28 43Q30 46 32 42Q34 46 37 43" fill="none" stroke="#57344a" stroke-width="2.5" stroke-linecap="round"/><path d="M29 35h6" stroke="#493153" stroke-width="3.5"/><circle cx="22" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3.5"/><circle cx="42" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3.5"/></g></svg><span data-en="Trap the Cat">ねこを かこもう！</span></a>
  </nav>
</main>
<footer class="feedback"><a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-en="Send feedback">感想をおくる</a><small>Copyright Momo.squirrels</small></footer>
</body>
</html>
