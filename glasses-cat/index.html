<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Glasses Cat by Momo.squirrels</title>
<link rel="stylesheet" href="../game.css">
<header class="site-banner"><img class="hello-rainbow" src="../assets/momo-squirrels.png" alt="Momo.squirrels" width="780" height="592"></header>
<main>
<header class="game-heading"><h1>Find the Glasses Cat</h1></header>
<p>Tap only the cats wearing glasses before time runs out!</p>
<div class="cat-example" id="cat-example"><span>Look for these glasses!</span></div>
<div class="stats"><span><output id="score">0</output> found</span><span><output id="time">30s left</output></span></div>
<div class="cat-grid" id="cats" aria-label="Cats"></div>
<button class="play-primary" id="play" type="button">Play</button>
<button id="practice" type="button">Practice</button>
<p id="result" role="status"></p>
<nav aria-label="Choose a game">
<a href="../"><img class="game-art" src="../assets/game-fries.png" alt="" width="40" height="40"><span>Fly Catch</span></a>
<a href="../smiley-bun-catch/"><img class="game-art" src="../assets/game-bun.png" alt="" width="40" height="40"><span>Smiley Bun Catch</span></a>
<a aria-current="page" href="../glasses-cat/"><img class="game-art" src="../assets/game-cat.png" alt="" width="40" height="40"><span>Find the Glasses Cat</span></a>
</nav>
</main>
<script src="cats.js"></script>
<script src="../tap.js"></script>
</html>
