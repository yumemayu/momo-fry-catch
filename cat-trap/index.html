<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メガネ猫をかこもう！ | Momo.squirrels</title>
<link rel="stylesheet" href="../game.css">
<link rel="stylesheet" href="../language.css">
<link rel="stylesheet" href="cat-trap.css">
<script defer src="../language.js"></script>
<script defer src="../scores.js"></script>
<script defer src="cat-trap.js"></script>
</head>
<body data-game="cat-trap">
<main class="trap-main">
  <header class="game-heading">
    <img class="hello-rainbow" src="../assets/momo-squirrels.png" alt="Momo.squirrels" width="780" height="592">
    <h1><span data-en="Trap the">メガネ猫を</span><br><span data-en="Glasses Cat">かこもう！</span></h1>
  </header>
  <div class="stats trap-stats">
    <span class="stat-card trap-hud"><span aria-hidden="true">🐾</span><span class="trap-hud-label" data-en="Moves">てかず</span> <output id="moves">0</output><span class="trap-hud-level" id="hud-level"></span></span>
  </div>
  <fieldset class="difficulty">
    <legend data-en="Choose a level">レベルを えらぶ</legend>
    <div class="level-buttons" role="group" aria-label="レベル" data-en-label="Level">
      <button type="button" data-level="easy" aria-pressed="true"><svg class="level-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M9 30 11 11 26 19 Q32 17 38 19 L53 11 55 30 C65 65 -1 65 9 30Z" fill="#d5eac6" stroke="#57344a" stroke-width="2"/><path d="M15 17 21 23 14 26Z M49 17 50 26 43 23Z" fill="#f987aa"/><circle cx="23" cy="35" r="2.2" fill="#57344a"/><circle cx="41" cy="35" r="2.2" fill="#57344a"/><path d="M28 43Q30 46 32 42Q34 46 37 43" fill="none" stroke="#57344a" stroke-width="2" stroke-linecap="round"/><path d="M29 35h6" stroke="#493153" stroke-width="3"/><circle cx="22" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3"/><circle cx="42" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3"/></svg><span data-en="Easy · 12 boxes">かんたん ・ 箱12こ</span></button>
      <button type="button" data-level="normal" aria-pressed="false"><svg class="level-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M9 30 11 11 26 19 Q32 17 38 19 L53 11 55 30 C65 65 -1 65 9 30Z" fill="#f6b57f" stroke="#57344a" stroke-width="2"/><path d="M15 17 21 23 14 26Z M49 17 50 26 43 23Z" fill="#f987aa"/><circle cx="23" cy="35" r="2.2" fill="#57344a"/><circle cx="41" cy="35" r="2.2" fill="#57344a"/><path d="M28 43Q30 46 32 42Q34 46 37 43" fill="none" stroke="#57344a" stroke-width="2" stroke-linecap="round"/><path d="M29 35h6" stroke="#493153" stroke-width="3"/><circle cx="22" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3"/><circle cx="42" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3"/></svg><span data-en="Normal · 8 boxes">ふつう ・ 箱8こ</span></button>
      <button type="button" data-level="hard" aria-pressed="false"><svg class="level-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M9 30 11 11 26 19 Q32 17 38 19 L53 11 55 30 C65 65 -1 65 9 30Z" fill="#d2b0eb" stroke="#57344a" stroke-width="2"/><path d="M15 17 21 23 14 26Z M49 17 50 26 43 23Z" fill="#f987aa"/><circle cx="23" cy="35" r="2.2" fill="#57344a"/><circle cx="41" cy="35" r="2.2" fill="#57344a"/><path d="M28 43Q30 46 32 42Q34 46 37 43" fill="none" stroke="#57344a" stroke-width="2" stroke-linecap="round"/><path d="M29 35h6" stroke="#493153" stroke-width="3"/><circle cx="22" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3"/><circle cx="42" cy="35" r="7" fill="none" stroke="#493153" stroke-width="3"/></svg><span data-en="Hard · 5 boxes">むずかしい ・ 箱5こ</span></button>
    </div>
  </fieldset>
  <div class="play-stack">
    <div class="play-stage">
      <div class="trap-field game-field" id="field" role="group" aria-label="ねこの いる ばん" data-en-label="Cat board"></div>
      <div class="game-card" id="ready-card">
        <svg class="ready-cat" viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="ct-head"><rect x="12" y="10" width="40" height="33" rx="15"/></clipPath><clipPath id="ct-body"><rect x="18" y="38" width="28" height="20" rx="7"/></clipPath></defs><path d="M44 55c8 1 13-5 12-13-.6-4.5-4-7-7-6 2.5 4 2 9-1 13-2 2.6-4 4-4 6Z" fill="#cfa87e" stroke="#57344a" stroke-width="2" stroke-linejoin="round"/><path d="M49.5 39.5c1.8.4 3.4 1.4 4.6 2.8M47.6 46.4c1.9-.2 3.8.3 5.4 1.4" fill="none" stroke="#a9744f" stroke-width="2" stroke-linecap="round"/><g clip-path="url(#ct-body)"><rect x="18" y="38" width="28" height="20" fill="#fff8ee"/><path d="M38 43c6-1 9 3 9 8s-3 8-8 8h-5c3-5 4-10 3-16Z" fill="#cfa87e"/></g><rect x="18" y="38" width="28" height="20" rx="7" fill="none" stroke="#57344a" stroke-width="2"/><path d="M25 58v-4M39 58v-4" stroke="#e0c8a8" stroke-width="2" stroke-linecap="round"/><path d="M15 15 18 3l11 5c-4.5 1-9.5 3.5-14 7Z" fill="#f6bd8a" stroke="#57344a" stroke-width="2" stroke-linejoin="round"/><path d="M49 15 46 3 35 8c4.5 1 9.5 3.5 14 7Z" fill="#fff8ee" stroke="#57344a" stroke-width="2" stroke-linejoin="round"/><path d="M18 12.5 19.5 7 25 10c-2.3.6-4.6 1.4-7 2.5Z" fill="#f9a8bc"/><path d="M46 12.5 44.5 7 39 10c2.3.6 4.6 1.4 7 2.5Z" fill="#f9a8bc"/><g clip-path="url(#ct-head)"><rect x="12" y="10" width="40" height="33" fill="#fff8ee"/><path d="M2 2h26v25c-9 4-19 2-26-4Z" fill="#f6bd8a"/></g><rect x="12" y="10" width="40" height="33" rx="15" fill="none" stroke="#57344a" stroke-width="2"/><ellipse cx="17" cy="34" rx="2.8" ry="1.7" fill="#f9c6d0" opacity=".85"/><ellipse cx="47" cy="34" rx="2.8" ry="1.7" fill="#f9c6d0" opacity=".85"/><path d="M4.5 30l8.5 1M5 35.5 13.5 34M59.5 30 51 31M59 35.5 50.5 34" stroke="#cbb59e" stroke-width="1.3" stroke-linecap="round"/><ellipse cx="23.5" cy="27" rx="3" ry="3.8" fill="#7fb6dd"/><ellipse cx="40.5" cy="27" rx="3" ry="3.8" fill="#7fb6dd"/><circle cx="22.5" cy="25.2" r="1.45" fill="#fff"/><circle cx="39.5" cy="25.2" r="1.45" fill="#fff"/><circle cx="24.7" cy="29.6" r=".65" fill="#fff" opacity=".9"/><circle cx="41.7" cy="29.6" r=".65" fill="#fff" opacity=".9"/><circle cx="23.5" cy="27" r="8.5" fill="none" stroke="#4a3428" stroke-width="2.6"/><circle cx="40.5" cy="27" r="8.5" fill="none" stroke="#4a3428" stroke-width="2.6"/><path d="M31 26.4q1-1.3 2 0M15 26l-3-1.6M49 26l3-1.6" fill="none" stroke="#4a3428" stroke-width="2.6" stroke-linecap="round"/><path d="M29.8 33.4h4.4l-2.2 2.6Z" fill="#f49fb4" stroke-linejoin="round"/><path d="M27.6 38.6q2.2 1.9 4.4 0 2.2 1.9 4.4 0" fill="none" stroke="#57344a" stroke-width="1.6" stroke-linecap="round"/></svg>
        <strong data-en="Ready to play?">はじめよう！</strong>
        <div class="player-setup">
          <label for="nickname" data-en="Nickname">ニックネーム</label>
          <input id="nickname" maxlength="20" placeholder="例：もち" data-en-placeholder="e.g. Mochi" autocomplete="off" aria-describedby="player-hint">
          <small id="player-hint" data-en="Enter a nickname to save your score on this device.">なまえを入れると、この端末にスコアが残るよ。</small>
        </div>
      </div>
    </div>
    <div class="game-card" id="score-card" role="status" aria-atomic="true" hidden>
      <span data-en="Score">スコア</span><strong id="final-score"></strong>
      <div class="trap-verdict" id="trap-verdict"></div>
      <p></p>
    </div>
    <button type="button" id="change-player" class="change-player" data-en="Change nickname" hidden>ニックネームをかえる</button>
    <div class="play-row">
      <button class="play-primary" id="start" type="button">Play</button>
      <button class="stop-button" id="stop" type="button" hidden>■ Stop</button>
    </div>
  </div>
  <p id="instructions" data-en="Tap a tile to drop a cardboard box. Surround the cat before it slips off the edge!">マスをタップして ダンボール箱を置こう。猫が 端から にげる前に、まわりを 全部 かこんでね！</p>
  <div class="music"><button id="sound" type="button" aria-pressed="true">おと ON</button></div>
  <section class="score-board" aria-labelledby="board-title">
    <div class="score-board-heading">
      <h2 id="board-title"><img src="../assets/game-cat.png" alt="" width="24" height="24"><span data-en="Leaderboard">ランキング</span></h2>
      <span id="score-level"></span>
      <div class="score-period" aria-label="Ranking period" role="group">
        <button type="button" data-period="weekly" aria-pressed="true" data-en="This week">今週</button>
        <button type="button" data-period="all" aria-pressed="false" data-en="All time">すべて</button>
      </div>
    </div>
    <p class="personal-best" id="personal-best"></p>
    <ol id="score-list"></ol>
  </section>
  <nav aria-label="Choose a game">
    <a href="../"><img class="game-art" src="../assets/game-fries.png" alt="" width="40" height="40"><span data-en="Fry Catch">フライキャッチ</span></a>
    <a href="../smiley-bun-catch/"><img class="game-art" src="../assets/game-bun.png" alt="" width="40" height="40"><span data-en="Smiley Bun Catch">にこにこ肉まんキャッチ</span></a>
    <a href="../glasses-cat/"><img class="game-art" src="../assets/game-cat.png" alt="" width="40" height="40"><span data-en="Find the Glasses Cat">メガネ猫さがし</span></a>
    <a href="../piano/"><span class="game-art piano-nav-icon" aria-hidden="true">♪</span><span data-en="MOMO Piano">MOMOピアノ</span></a>
    <a href="../capybara-merge/"><img class="game-art" src="../capybara-merge/pieces/4.webp" alt="" width="40" height="40"><span data-en="Capybara Onsen Merge">カピバラ温泉マージ</span></a>
    <a href="../capybara-memory/"><img class="game-art" src="../capybara-merge/pieces/7.webp" alt="" width="40" height="40"><span data-en="Capybara Memory">カピバラ神経衰弱</span></a>
    <a href="../capybara-tap/"><img class="game-art" src="../capybara-merge/pieces/7.webp" alt="" width="40" height="40"><span data-en="Capybara Bath Tap">カピバラおふろタップ</span></a>
    <a aria-current="page" href="./"><img class="game-art" src="../assets/game-cat.png" alt="" width="40" height="40"><span data-en="Trap the Glasses Cat">メガネ猫をかこもう！</span></a>
  </nav>
</main>
