<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOMO Piano</title>
  <link rel="stylesheet" href="piano.css">
<link rel="stylesheet" href="../language.css">
  <script defer src="../language.js"></script>
<script src="piano.js" defer></script>
</head>
<body>
<main id="momo-piano-levels">
  <aside class="piano-sidebar">
    <div class="momo-art">
      <h1 class="patch">MOM<span>O</span><br>PIANO</h1>
      <div class="hero">
        <span class="gem one" aria-hidden="true">✦</span>
        <span class="gem two" aria-hidden="true">♪</span>
        <span class="gem three" aria-hidden="true">★</span>
        <span class="gem four" aria-hidden="true">♥</span>
        <img class="avatar" src="momo-avatar.webp" width="350" height="350" alt="MOMO">
      </div>
    </div>
      <div class="choices" role="group" aria-label="モードを えらぶ">
        <button type="button" class="choice free cursor-interaction" data-action="free" aria-pressed="true"><span aria-hidden="true">♫</span> <span data-copy="free">じゆうピアノ</span></button>
        <button type="button" class="choice guided cursor-interaction" data-action="songs" aria-pressed="false"><span aria-hidden="true">☆</span> <span data-copy="guided">おてほんピアノ</span></button>
      </div>
    <div class="level-buttons" role="group" aria-label="レベルを えらぶ" hidden></div>
  </aside>
  <section class="phone play select-song" data-screen="songs" hidden aria-labelledby="momo-song-heading">
    <h2 id="momo-song-heading" data-copy="selectSong">きょくを えらぶ</h2>
    <div class="song-list"></div>
  </section>
  <section class="phone play" data-screen="playing" aria-labelledby="momo-current-song">
      <header><button type="button" class="back cursor-interaction" data-action="back" data-copy="back" hidden>‹ もどる</button><span class="mode"></span></header>
      <div class="song">
        <div class="sparkles" aria-hidden="true"><span>✧</span>★<span>✦</span></div>
        <h2 id="momo-current-song"></h2>
        <div class="track" role="progressbar" aria-label="曲の進み具合" aria-valuemin="0" aria-valuemax="42" aria-valuenow="0"><div></div></div>
        <p class="hint" aria-live="polite">ひかる「ド」を おしてね</p>
      </div>
      <div class="falling-roll" aria-hidden="true" hidden></div>
      <div class="piano" role="group" aria-label="ピアノの鍵盤">
        <div class="piano-row" role="group" aria-label="低い音">
          <span class="row-label" data-copy="lower">低い音</span>
          <div class="key-row lower-keys"></div>
        </div>
        <div class="piano-row" role="group" aria-label="高い音">
          <span class="row-label" data-copy="higher">高い音</span>
          <div class="key-row upper-keys"></div>
        </div>
      </div>
      <div class="celebration" hidden>
        <span aria-hidden="true">✦ ★ ✦</span>
        <strong>クリアおめでとう！</strong>
        <small class="challenge-result" hidden></small>
      </div>
      <div class="play-footer">
        <span class="count"></span>
        <button class="reset cursor-interaction" data-copy="reset" type="button">はじめから</button>
      </div>
  </section>
  <nav class="game-picker" aria-label="Choose a game">
    <a href="../"><img src="../assets/game-fries.png" alt="" width="40" height="40"><span data-ja="フライキャッチ">Fry Catch</span></a>
    <a href="../smiley-bun-catch/"><img src="../assets/game-bun.png" alt="" width="40" height="40"><span data-ja="にこにこ肉まんキャッチ">Smiley Bun Catch</span></a>
    <a href="../glasses-cat/"><img src="../assets/game-cat.png" alt="" width="40" height="40"><span data-ja="メガネ猫さがし">Find the Glasses Cat</span></a>
    <a href="./" aria-current="page"><span aria-hidden="true">♪</span><span data-ja="MOMOピアノ">MOMO Piano</span></a>
      <a href="../capybara-merge/"><img src="../capybara-merge/pieces/4.webp" alt="" width="40" height="40"><span data-ja="カピバラ温泉マージ">Capybara Onsen Merge</span></a>
      <a href="../capybara-memory/"><img src="../capybara-merge/pieces/10.webp" alt="" width="40" height="40"><span data-ja="カピバラ神経衰弱">Capybara Memory</span></a>
      <a href="../capybara-tap/"><img src="../capybara-merge/pieces/7.webp" alt="" width="40" height="40"><span data-ja="カピバラおふろタップ">Capybara Bath Tap</span></a>
      <a href="../cat-trap/"><span class="game-art trap-nav-icon" aria-hidden="true">⬢</span><span data-ja="ねこを かこもう！">Trap the Cat</span></a>
  </nav>
</main>
</body>
</html>
