<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-en-title="Puppy Copycat">犬のまねっこ</title>
  <link rel="stylesheet" href="../language.css">
  <link rel="stylesheet" href="../toy-box/toys.css?v=bun-mix">
  <script defer src="../language.js"></script>
<script defer src="../nickname.js?v=compact"></script>
<link rel="stylesheet" href="../nickname.css?v=compact">
  <script defer src="../stickers.js"></script>
  <script defer src="../toy-box/toys.js?v=standalone"></script>
</head>
<body>
<main>
  <header><a href="../" data-ja="← ゲーム一覧">← Games</a></header>
  <section id="dog" class="toy">
    <h2 data-ja="犬のまねっこ">Puppy Copycat</h2>
    <p data-ja="犬が見せたポーズを、同じ順番で押そう。">Copy the puppy’s moves in the same order.</p>
    <div class="puppy-stage"><img id="puppy" src="../toy-box/momo-cloud-dog.jpg" alt="MOMO’s cloud dog" data-ja-label="MOMOの雲の犬"><span id="puppy-move" aria-hidden="true"></span></div>
    <button id="dog-start" class="action" data-ja="はじめる">Start</button>
    <p id="dog-status" class="status" role="status"></p>
    <div class="choices moves">
      <button type="button" disabled data-move="0" data-ja="🦴 おすわり">🦴 Sit</button>
      <button type="button" disabled data-move="1" data-ja="🐾 おて">🐾 Paw</button>
      <button type="button" disabled data-move="2" data-ja="✦ ジャンプ">✦ Jump</button>
    </div>
    <a class="puppy-video" href="https://www.youtube.com/watch?v=kfjC_qBUi0I" target="_blank" rel="noopener noreferrer" data-ja="▶ 雲の犬をYouTubeで見る">▶ Watch the cloud dog on YouTube</a>
  </section>
<details class="momo-nickname-panel" data-nickname-panel>
  <summary>Set nickname</summary>
  <form>
    <label for="shared-nickname" data-ja="ニックネーム">Nickname</label>
    <input id="shared-nickname" maxlength="20" autocomplete="off">
    <button type="submit" data-ja="保存">Save</button>
  </form>
  <small role="status"></small>
</details>
  <footer><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a></footer>
</main>
<span id="sticker-announcement" class="toy-sr-only" role="status"></span>
</body>
</html>
