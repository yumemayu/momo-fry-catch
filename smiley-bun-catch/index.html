<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smiley Bun Catch by Momo.squirrels</title>
<link rel="stylesheet" href="../game.css">
<body data-game="buns">
<main>
<header class="game-heading"><img class="hello-rainbow" src="../assets/momo-squirrels.png" alt="Momo.squirrels" width="780" height="592"><h1>Smiley Bun Catch</h1></header>
<div class="bun-rules">
  <span><img src="../assets/game-bun.png" alt="" width="40" height="40"> Smiley Bun <strong>+1</strong></span>
  <span><img src="../assets/devil-bun.png" alt="" width="40" height="40"> Devil Bun <strong>−1</strong></span>
</div>
<fieldset class="difficulty"><legend>Pick a level</legend>
<div class="level-buttons">
<button type="button" data-level="super-easy" aria-pressed="false"><span class="level-icon" aria-hidden="true">🌱</span><span>Super Easy</span></button>
<button type="button" data-level="easy" aria-pressed="true"><span class="level-icon" aria-hidden="true">🌼</span><span>Easy</span></button>
<button type="button" data-level="medium" aria-pressed="false"><span class="level-icon" aria-hidden="true">🦋</span><span>Medium</span></button>
<button type="button" data-level="hard" aria-pressed="false"><span class="level-icon" aria-hidden="true">⭐</span><span>Hard</span></button>
<button type="button" data-level="impossible" aria-pressed="false"><span class="level-icon" aria-hidden="true">🚀</span><span>Impossible</span></button>
</div></fieldset>
<div class="stats"><span><img class="stat-icon" src="../assets/game-bun.png" alt=""> <output id="score">0</output> points</span><span><output id="time">30</output>s left</span></div>
<canvas id="field" aria-label="Smiley Bun Catch play area">Smiley Bun Catch play area</canvas>
<button class="play-primary" id="start" type="button">Play</button>
<div class="controls">
<button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button>
</div>
<p id="result" role="status">Drag on the game or use the arrow buttons.</p>
<div class="music"><button id="music" type="button" aria-pressed="true">Music on</button><label>Volume <input id="volume" type="range" min="0" max="100" value="25"></label></div>
<nav aria-label="Choose a game">
<a href="../"><img class="game-art" src="../assets/game-fries.png" alt="" width="40" height="40"><span>Fly Catch</span></a>
<a aria-current="page" href="../smiley-bun-catch/"><img class="game-art" src="../assets/game-bun.png" alt="" width="40" height="40"><span>Smiley Bun Catch</span></a>
<a href="../glasses-cat/"><img class="game-art" src="../assets/game-cat.png" alt="" width="40" height="40"><span>Find the Glasses Cat</span></a>
</nav>
</main>
<script src="../catch.js"></script>
</body>
<script src="../tap.js"></script>
</html>
